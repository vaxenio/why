name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pinned: the golden fixtures are byte-deterministic for this exact
          # toolchain (see test/fixtures/README.md). "go 1.26" would resolve
          # to the latest patch and break the determinism guard.
          go-version: '1.26.5'
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
